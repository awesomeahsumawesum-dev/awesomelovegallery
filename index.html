<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<style>
  :root {
    --bg: #101010;
    --ink: #f2f2f0;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1600px;
  }

  .track {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
  }

  .card {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(46vw, 62vh);
    height: min(62vh, 46vw);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,0,0,0.55);
    transition: transform 0.55s cubic-bezier(.2,.8,.25,1), opacity 0.55s ease, filter 0.55s ease;
    cursor: pointer;
    background: #1a1a1a;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  .card.center {
    cursor: default;
  }

  /* icon buttons */
  .icon-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 20;
    transition: background 0.2s ease, opacity 0.2s ease;
    opacity: 0.55;
  }

  .icon-btn:hover {
    background: rgba(255,255,255,0.16);
    opacity: 1;
  }

  .icon-btn svg {
    width: 18px;
    height: 18px;
    stroke: var(--ink);
    fill: none;
  }

  #prevBtn { left: clamp(10px, 3vw, 40px); }
  #nextBtn { right: clamp(10px, 3vw, 40px); }

  #fsView {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
  }

  #fsView.open {
    display: flex;
  }

  #fsView img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  #fsView:fullscreen,
  #fsView:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="track" id="track"></div>
  <button class="icon-btn" id="prevBtn" aria-label="Previous">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="icon-btn" id="nextBtn" aria-label="Next">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>

<div id="fsView">
  <img id="fsImg" src="" alt="">
</div>

<script>
  const images = [
    "images/IMG_4944.jpeg",
    "images/IMG_4951.jpeg",
    "images/IMG_4952-Enhanced-NR.jpeg",
    "images/IMG_4998.jpeg",
    "images/IMG_5029.jpeg",
    "images/IMG_5070.jpeg",
    "images/IMG_5076.jpeg",
    "images/IMG_5079.jpeg",
    "images/IMG_5086.jpeg",
    "images/IMG_5117.jpeg",
    "images/IMG_5131.jpeg",
    "images/P6454846_01.jpeg",
    "images/P6454852.jpeg",
    "images/P6454880.jpeg",
    "images/P6454954.jpeg",
    "images/P6454958.jpeg",
    "images/P6454990.jpeg",
    "images/P6455003.jpeg",
    "images/P6455124.jpeg"
  ];

  const track = document.getElementById('track');
  let current = 0;
  const SPREAD = 5; // how many cards visible on each side

  const cards = images.map((src, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    img.loading = 'lazy';
    card.appendChild(img);
    card.addEventListener('click', () => {
      if (i !== current) goTo(i);
      else openFullscreen();
    });
    track.appendChild(card);
    return card;
  });

  function layout() {
    cards.forEach((card, i) => {
      let offset = i - current;
      if (offset > images.length / 2) offset -= images.length;
      if (offset < -images.length / 2) offset += images.length;

      const abs = Math.abs(offset);
      if (abs > SPREAD) {
        card.style.opacity = '0';
        card.style.pointerEvents = 'none';
        card.style.transform = `translate(-50%, -50%) translateX(${offset > 0 ? 100 : -100}vw) scale(0.5)`;
        return;
      }

      card.style.pointerEvents = 'auto';
      card.classList.toggle('center', offset === 0);

      const tx = offset * 46;
      const rot = offset === 0 ? 0 : (offset > 0 ? -32 : 32);
      const tz = -abs * 160;
      const scale = offset === 0 ? 1 : 0.72;
      const opacity = 1 - abs * 0.18;

      card.style.zIndex = 100 - abs;
      card.style.opacity = Math.max(opacity, 0.15);
      card.style.transform =
        `translate(-50%, -50%) translateX(${tx}%) translateZ(${tz}px) rotateY(${rot}deg) scale(${scale})`;
      card.style.filter = offset === 0 ? 'none' : `brightness(0.55)`;
    });
  }

  function goTo(i) {
    current = ((i % images.length) + images.length) % images.length;
    layout();
  }

  document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
  document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeFullscreen(); return; }
    if (e.key === 'ArrowLeft') { goTo(current - 1); if (fsView.classList.contains('open')) fsImg.src = images[current]; }
    if (e.key === 'ArrowRight') { goTo(current + 1); if (fsView.classList.contains('open')) fsImg.src = images[current]; }
    if (e.key === 'f' || e.key === 'F') openFullscreen();
  });

  let touchStartX = null;
  document.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
  document.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (dx > 50) goTo(current - 1);
    else if (dx < -50) goTo(current + 1);
    touchStartX = null;
  });

  let wheelLock = false;
  document.addEventListener('wheel', (e) => {
    if (wheelLock) return;
    wheelLock = true;
    if (e.deltaY > 0 || e.deltaX > 0) goTo(current + 1);
    else goTo(current - 1);
    setTimeout(() => wheelLock = false, 400);
  }, { passive: true });

  const fsView = document.getElementById('fsView');
  const fsImg = document.getElementById('fsImg');

  function openFullscreen() {
    fsImg.src = images[current];
    fsView.classList.add('open');
    const req = fsView.requestFullscreen || fsView.webkitRequestFullscreen || fsView.msRequestFullscreen;
    if (req) req.call(fsView);
  }

  function closeFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
    } else {
      fsView.classList.remove('open');
    }
  }

  fsView.addEventListener('click', closeFullscreen);

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) fsView.classList.remove('open');
  });
  document.addEventListener('webkitfullscreenchange', () => {
    if (!document.webkitFullscreenElement) fsView.classList.remove('open');
  });

  layout();
</script>

</body>
</html>
